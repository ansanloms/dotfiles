# Windows 向けフォントの取得。
# Moralerspace (yuru7/moralerspace、OFL-1.1) の HWJPDOC を per-user フォントディレクトリへ展開する。
# HKCU への登録は run_onchange_after_register-fonts.ps1.tmpl が行う。
{{ if eq .chezmoi.os "windows" -}}
{{- $version := "2.0.0" -}}
["AppData/Local/Microsoft/Windows/Fonts"]
    type = "archive"
    url = "https://github.com/yuru7/moralerspace/releases/download/v{{ $version }}/MoralerspaceHWJPDOC_v{{ $version }}.zip"
    stripComponents = 1
    include = ["**/*.ttf"]
    ["AppData/Local/Microsoft/Windows/Fonts".checksum]
        sha256 = "3598729cb4693ff74fe32695fac167991d6bee55fc1649281aab64f311624907"
{{ end -}}
