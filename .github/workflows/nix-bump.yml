name: nix bump

# 自前 derivation の version・ハッシュ・lockfile を更新し、
# ビルド検証のうえ直接 main へコミットする。適用はローカルで行う (chezmoi apply の後に nix profile upgrade --all --impure)。

on:
  schedule:
    - cron: "0 7 * * *" # 毎日 07:00 UTC (16:00 JST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # upstream nix を使う (Determinate Nix から移行済み)。flakes / nix-command は
      # 既定で無効のため extra_nix_config で有効化する。
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump self-built packages
        # claude-statusline / md2html / sonarqube-cli の upgrade.sh が gh で最新タグや Release 資産を引くため GH_TOKEN が必要。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for s in dot_config/nix/*/upgrade.sh; do
            "$s"
          done

      - name: Stage and detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 壊れた変更を main に流さないため build を gate にする。失敗で job が止まり commit は skip。
      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: nix build ./dot_config/nix#packages.x86_64-linux.default --impure --no-link --print-build-logs

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 自前 nix パッケージのバージョンを更新"
          # 並行するワークフローが先に main へ push していると non-fast-forward で
          # 弾かれるため、remote の進みを取り込んでから push する。
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
