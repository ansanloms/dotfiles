link:
  ~/.config/git:
    - src: ./.config/git
  ~/.config/git/config.os:
    - src: ./.config/git/config.windows
      targets:
        - windows
    - src: ./.config/git/config.linux
      targets:
        - linux
  ~/.config/vim:
    - src: ./.config/vim
  ~/.vimrc:
    - src: ./.vimrc
  ~/.config/nix:
    - src: ./.config/nix
      targets:
        - linux
  ~/.local/bin/git-worktree-select:
    - src: ./.local/bin/git-worktree-select
      targets:
        - linux
  ~/.local/bin/git-worktree-include:
    - src: ./.local/bin/git-worktree-include
      targets:
        - linux
  ~/.local/bin/git-worktree-sweep:
    - src: ./.local/bin/git-worktree-sweep
      targets:
        - linux
