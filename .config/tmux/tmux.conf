# prefix は Ctrl+Space (zellij のモード切替キーを踏襲)。
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g history-limit 100000

# 24bit color。
set -g default-terminal "tmux-256color"
set -ga terminal-features ",alacritty*:RGB"

# コピーを OSC 52 でホストのクリップボードへ書く (alacritty 側: osc52 = "CopyPaste")。
set -s set-clipboard on

# Neovim 向け: Esc の遅延を無くし、フォーカスイベントを透過する。
set -s escape-time 0
set -g focus-events on

# window (タブ) は 1 始まりで、閉じたら詰め直す。
set -g base-index 1
set -g renumber-windows on

setw -g mode-keys vi

# ペイン境界にタイトルを表示する (tmux-workspace が AI Agent / Neovim / Terminal を設定する)。
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# 配色: terafox (.config/alacritty/themes/terafox.toml) に合わせる。
set -g status-style "bg=#254147,fg=#e6eaea"
set -g status-left "[#S] "
set -g status-left-length 32
set -g status-right ""
set -g window-status-style "fg=#cbd9d8"
set -g window-status-current-style "bg=#7aa4a1,fg=#152528,bold"
set -g pane-border-style "fg=#425e5e"
set -g pane-active-border-style "fg=#7aa4a1"
set -g message-style "bg=#425e5e,fg=#e6eaea"

# スクロールバックを nvim で開く (zellij の scrollback_editor 相当)。
bind e {
  capture-pane -S -
  save-buffer /tmp/tmux-scrollback.txt
  delete-buffer
  new-window -n scrollback "nvim /tmp/tmux-scrollback.txt"
}
