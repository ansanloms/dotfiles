name: dotfiles
version: 1.0.0
description: APM project for dotfiles
author: ansanloms
dependencies:
  apm:
    - ansanloms/skills/nvim-remote
    - ansanloms/skills/find-docs
    - ansanloms/skills/worktree#a26b7fd0d7f538d22d8b27fd674264dd70f0df19
    - ansanloms/skills/infra-architecture
    - mizchi/skills/empirical-prompt-tuning
    - mizchi/skills/retrospective-codify
    - ansanloms/skills/ja-tech-proofread
    - ansanloms/skills/adr
    - git: nanaism/yomiyasu
      skills:
        - yomiyasu
  mcp: []
targets:
  - claude
includes: auto
scripts: {}
lifecycle:
  post-install:
    - type: command
      description: npm ci
      command: 'rc=0; for d in "$HOME"/.claude/skills/*/scripts; do [ -f "$d/package-lock.json"
        ] || continue; node -e ''const p=require(process.argv[1]);process.exit(Object.keys(p.dependencies||{}).length?0:1)''
        "$d/package.json" || continue; echo "npm ci: $d"; npm ci --omit=dev --prefix
        "$d" || rc=1; done; exit $rc'
      timeoutSec: 300
